<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SFVInterceptor</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <div class="logo">
    <img class="logo-icon" src="../icons/icon48.png" alt="">
    <div class="logo-text">SFV Interceptor<span>Request workspace</span></div>
  </div>
  <div class="header-actions">
    <button class="btn-primary" id="new-rule">+ New Rule</button>
  </div>
</header>
<div class="tabs" role="group" aria-label="Rule status">
  <button type="button" class="tab active" data-tab="active" aria-pressed="true">Active</button>
  <button type="button" class="tab" data-tab="all" aria-pressed="false">All rules</button>
</div>
<div class="search-row">
  <span class="search-row-icon" id="popup-search-icon" aria-hidden="true"></span>
  <input class="search-row-input" id="popup-search" name="search" type="search" placeholder="Search rules" aria-label="Search rules">
</div>
<p class="popup-error" id="popup-error" role="alert" hidden></p>
<div class="rules-list" id="rules-list"></div>
<footer>
  <div class="stats" id="stats"><b>0</b> rules · <b>0</b> active</div>
  <button class="btn-sm" id="open-dashboard">Open dashboard</button>
</footer>
<script type="module" src="popup.js"></script>
</body>
</html>
