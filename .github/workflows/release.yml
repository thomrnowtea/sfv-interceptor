name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run check

      - name: Package the tagged version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run package -- --tag "$RELEASE_TAG"

      - name: Package a manual preview
        if: github.ref_type != 'tag'
        run: npm run package

      - name: Install Chromium for archive verification
        run: npx playwright install --with-deps chromium

      - name: Test the extracted ZIP
        run: npm run test:release

      - name: Keep the verified download artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sfv-interceptor-release
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: Publish the tagged release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/sfv-interceptor-$RELEASE_TAG.zip" \
            "dist/sfv-interceptor-$RELEASE_TAG.zip.sha256" \
            --repo "$GH_REPO" \
            --verify-tag \
            --title "SFV Interceptor $RELEASE_TAG" \
            --generate-notes \
            --notes-file docs/release-body.md
